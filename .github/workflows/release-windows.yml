# Release manuelle de secours. Les releases normales sont créées par build-windows.yml.
name: Publier une release Windows (manuel)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund
      - name: Générer les icônes
        run: npm run icons
      - name: Tests
        run: npm test
      - name: Construire les exécutables
        run: npm run build:win
      - name: Publier la release (secours manuel)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "v$version" dist/Evolve-*-Setup.exe dist/Evolve-*-portable.exe --generate-notes --title "Evolve $version"
