# Build Windows + publication d'une release automatique à chaque push.
name: Exécutables Windows

on:
  push:
    branches: ['**']
    paths:
      - '**'
      - '!README.md'
      - '!docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Tester, construire et publier Evolve
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: bash scripts/ci-run.sh installation npm ci --no-audit --no-fund
      - name: Définir la version de cette compilation
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');const base=p.version.split('.');p.version=base[0]+'.'+base[1]+'.'+process.env.GITHUB_RUN_NUMBER;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('Version:',p.version)"
      - name: Regénérer la planche d'icônes
        run: bash scripts/ci-run.sh regeneration-icones npm run icons
      - name: Tests automatiques
        run: bash scripts/ci-run.sh tests-automatiques npm test
      - name: Régler la résolution
        continue-on-error: true
        shell: powershell
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "Résolution par défaut conservée." }
      - name: Auto-test de l'application
        timeout-minutes: 8
        run: bash scripts/ci-run.sh auto-test-application node scripts/check-exe.mjs electron --out=self-test-output/application -- .
      - name: Construire Portable et Setup
        run: bash scripts/ci-run.sh fabrication-executables npm run build:win
      - name: Vérifier le manifeste
        run: bash scripts/ci-run.sh droits-administrateur npm run check:manifest
      - name: Auto-test du portable
        timeout-minutes: 8
        run: bash scripts/ci-run.sh auto-test-executable node scripts/check-exe.mjs --out=self-test-output/executable
      - name: Vérifier le lancement normal
        timeout-minutes: 8
        run: bash scripts/ci-run.sh lancement-normal node scripts/check-launch.mjs --out=self-test-output/lancement
      - name: Vérifier la persistance des réglages
        timeout-minutes: 12
        run: bash scripts/ci-run.sh reglages-redemarrage node scripts/check-settings.mjs --out=self-test-output/reglages --settings-dir="$APPDATA/Evolve"
      - name: Vérifier les dossiers personnels
        timeout-minutes: 8
        run: bash scripts/ci-run.sh documents-absent node scripts/check-documents.mjs --out=self-test-output/documents-absent
      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auto-test
          path: |
            self-test-output/
            ci-logs/
          if-no-files-found: warn
          retention-days: 30
      - name: Créer la release et publier les exécutables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          portable="$(ls dist/Evolve-*-portable.exe)"
          setup="$(ls dist/Evolve-*-Setup.exe)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$setup" "$portable" --clobber
          else
            gh release create "$tag" "$setup" "$portable" --title "Evolve $version" --generate-notes
          fi
          echo "### Release Evolve $version" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/leoblanchart92-hub/Evolve/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
