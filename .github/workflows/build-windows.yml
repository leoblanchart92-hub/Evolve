# Evolve — Fabrication des fichiers publiés pour Windows.
#
# À chaque envoi de code, une machine Windows de GitHub :
#   1. lance les tests automatiques ;
#   2. démarre l'application et vérifie que l'interface répond (auto-test) ;
#   3. fabrique l'exécutable portable et les deux programmes d'installation
#      (l'un pour l'utilisateur courant, sans droits d'administrateur ; l'autre
#      pour tous les utilisateurs, dans « Program Files ») ;
#   4. vérifie les droits que chacun de ces fichiers demande à Windows, relève
#      leur empreinte SHA-256 et rassemble le tout dans une image .iso ;
#   5. démarre l'exécutable portable et lui fait repasser l'auto-test ;
#   6. lance ce fichier normalement, comme un double-clic : fenêtre en plein
#      écran, écran comparé à l'image dessinée par l'application, fermeture
#      normale, fichiers temporaires, rien d'écrit dans le profil ;
#   7. lance ce fichier deux fois de suite : des réglages modifiés au premier
#      lancement doivent être sur le disque, puis retrouvés au second ;
#   8. lance le programme d'installation en silence : l'application installée
#      doit passer l'auto-test, puis être entièrement désinstallée ;
#   9. publie les quatre fichiers et leurs empreintes, téléchargeables depuis
#      la page de l'exécution (rubrique « Artifacts »), ainsi que les rapports
#      et les captures d'écran des vérifications.
#
# Rien n'est publié tant que toutes les vérifications n'ont pas réussi.
#
# Les étapes passent par scripts/ci-run.sh : en cas d'échec, la fin de leur
# sortie est affichée en tête de la page de l'exécution.

name: Fichiers publiés pour Windows

on:
  push:
    branches: ['**']
    # Une modification de la seule documentation ne nécessite pas de recompiler.
    paths:
      - '**'
      - '!README.md'
      - '!docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tester et fabriquer les fichiers publiés
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: bash scripts/ci-run.sh installation npm ci --no-audit --no-fund

      - name: Tests automatiques
        run: bash scripts/ci-run.sh tests-automatiques npm test

      # Les machines de GitHub affichent par défaut en 1024 × 768 ; une
      # définition courante donne des captures d'écran plus représentatives.
      # L'auto-test fonctionne dans les deux cas : cette étape est facultative.
      - name: Régler l'écran de la machine en 1920 × 1080
        continue-on-error: true
        shell: powershell
        run: |
          try {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop
            Write-Host "Ecran regle en 1920 x 1080."
          } catch {
            Write-Host "Reglage impossible, definition par defaut conservee : $($_.Exception.Message)"
          }

      - name: Auto-test de l'application (avant fabrication du .exe)
        timeout-minutes: 8
        run: bash scripts/ci-run.sh auto-test-application node scripts/check-exe.mjs electron --out=self-test-output/application -- .

      - name: Fabriquer l'exécutable portable et les deux programmes d'installation
        run: bash scripts/ci-run.sh fabrication npm run build:win

      # Le manifeste de chaque fichier dit à Windows quels droits demander :
      # jamais l'élévation, sauf pour l'installation dans « Program Files ».
      - name: Vérifier les droits demandés à Windows
        run: bash scripts/ci-run.sh droits-demandes npm run check:manifest

      # Empreintes des trois exécutables : elles accompagnent les fichiers dans
      # l'image .iso. Le second passage, après la fabrication de l'image, y
      # ajoute l'empreinte de l'image elle-même — qu'elle ne peut pas contenir.
      - name: Empreintes SHA-256 des exécutables
        run: bash scripts/ci-run.sh empreintes-executables npm run build:checksums

      - name: Image .iso des fichiers publiés
        run: bash scripts/ci-run.sh image-iso npm run build:iso

      - name: Empreintes SHA-256 de tous les fichiers publiés
        run: bash scripts/ci-run.sh empreintes node scripts/checksums.mjs dist/Evolve-*-portable.exe dist/Evolve-*-setup.exe dist/Evolve-*-setup-tous-utilisateurs.exe dist/Evolve-*.iso

      - name: Auto-test de l'exécutable portable
        timeout-minutes: 8
        run: bash scripts/ci-run.sh auto-test-executable node scripts/check-exe.mjs --out=self-test-output/executable

      # L'auto-test ouvre une fenêtre ordinaire ; ici, l'exécutable est lancé
      # sans aucune option d'essai, exactement comme par un double-clic.
      - name: Lancement normal de l'exécutable portable (plein écran)
        timeout-minutes: 8
        run: bash scripts/ci-run.sh lancement-normal node scripts/check-launch.mjs --out=self-test-output/lancement

      # Deux lancements successifs sur le véritable dossier de l'utilisateur
      # (%APPDATA%\Evolve, absent de cette machine) : le premier modifie des
      # réglages depuis l'interface, le script lit le fichier laissé sur le
      # disque, le second doit les afficher. Le fichier est ensuite retiré.
      - name: Réglages conservés après un redémarrage de l'exécutable portable
        timeout-minutes: 12
        run: bash scripts/ci-run.sh reglages-redemarrage node scripts/check-settings.mjs --out=self-test-output/reglages --settings-dir="$APPDATA/Evolve"

      # L'explorateur est en lecture seule : il ne doit rien créer. Le dossier
      # Documents du compte de cette machine est mis de côté (renommé) le
      # temps d'un lancement : l'exécutable doit l'annoncer comme introuvable,
      # et le script constate lui-même, sur le disque, que le dossier est
      # toujours absent — avant de le remettre en place.
      - name: Dossier Documents absent jamais recréé par l'exécutable portable
        timeout-minutes: 8
        run: bash scripts/ci-run.sh documents-absent node scripts/check-documents.mjs --out=self-test-output/documents-absent

      # Installation réelle, sans droits d'administrateur : le programme
      # d'installation est lancé en silence, l'application installée passe
      # l'auto-test, puis elle est désinstallée — et la machine doit s'en
      # trouver comme avant, réglages de l'utilisateur compris.
      - name: Installation silencieuse, auto-test de l’application installée, désinstallation
        timeout-minutes: 12
        run: bash scripts/ci-run.sh installation node scripts/check-setup.mjs --out=self-test-output/installation

      - name: Publier les rapports et les captures d'écran des vérifications
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auto-test
          path: |
            self-test-output/
            ci-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Résumé des fichiers publiés
        run: |
          {
            echo "### 📦 Fichiers publiés"
            echo ""
            echo "| Fichier | Taille | Empreinte SHA-256 |"
            echo "| --- | --- | --- |"
            for file in dist/Evolve-*-portable.exe dist/Evolve-*-setup.exe dist/Evolve-*-setup-tous-utilisateurs.exe dist/Evolve-*.iso; do
              [ -f "$file" ] || continue
              size="$(stat -c %s "$file")"
              sha="$(sha256sum "$file" | cut -d ' ' -f 1)"
              echo "| \`$(basename "$file")\` | $((size / 1024 / 1024)) Mo | \`$sha\` |"
            done
            echo ""
            echo "Téléchargement : rubrique **Artifacts**, en bas de cette page. Les empreintes sont aussi réunies dans \`SHA256SUMS.txt\`."
          } >> "$GITHUB_STEP_SUMMARY"
          for file in dist/Evolve-*-portable.exe dist/Evolve-*-setup.exe dist/Evolve-*-setup-tous-utilisateurs.exe dist/Evolve-*.iso; do
            [ -f "$file" ] || continue
            size="$(stat -c %s "$file")"
            echo "::notice title=Fichier publié::$(basename "$file") — $((size / 1024 / 1024)) Mo"
          done

      # Publiés tels quels (sans archive .zip) : les fichiers téléchargés sont
      # directement les exécutables, l'image et les empreintes.
      - name: Publier les fichiers publiés
        uses: actions/upload-artifact@v7
        with:
          name: Evolve-windows
          path: |
            dist/Evolve-*-portable.exe
            dist/Evolve-*-setup.exe
            dist/Evolve-*-setup-tous-utilisateurs.exe
            dist/Evolve-*.iso
            dist/SHA256SUMS.txt
          archive: false
          if-no-files-found: error
          retention-days: 90
