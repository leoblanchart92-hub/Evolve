# Evolve — Fabrication de l'exécutable Windows portable.
#
# À chaque envoi de code, une machine Windows de GitHub :
#   1. compile le module natif qui renomme ou déplace sans jamais rien
#      remplacer (native/evolve_fs.c), puis l'éprouve sur son disque : nom
#      déjà pris refusé par Windows, déplacements simultanés vers un même
#      nom, autre lecteur ;
#   2. lance les tests automatiques ;
#   3. démarre l'application et vérifie que l'interface répond (auto-test) ;
#      l'explorateur y mène de vraies opérations sur ses propres fichiers
#      d'essai : créer, renommer, copier, déplacer, envoyer à la Corbeille
#      de Windows, ouvrir ;
#   4. fabrique le fichier .exe portable ;
#   5. vérifie ce fichier : aucun droit administrateur demandé, module natif
#      embarqué identique à celui qui a été éprouvé, puis démarrage réel et
#      nouveau passage de l'auto-test ;
#   6. lance ce fichier normalement, comme un double-clic : fenêtre en plein
#      écran, écran comparé à l'image dessinée par l'application, fermeture
#      normale, fichiers temporaires, rien d'écrit dans le profil ;
#   7. lance ce fichier deux fois de suite : des réglages modifiés au premier
#      lancement doivent être sur le disque, puis retrouvés au second ;
#   8. met de côté le dossier Documents de la machine le temps d'un
#      lancement : il doit être annoncé comme introuvable, jamais recréé ;
#   9. publie le .exe, téléchargeable depuis la page de l'exécution
#      (rubrique « Artifacts »), ainsi que les rapports et les captures
#      d'écran des vérifications.
#
# Le .exe n'est publié que si toutes les vérifications ont réussi.
#
# Les étapes passent par scripts/ci-run.sh : en cas d'échec, la fin de leur
# sortie est affichée en tête de la page de l'exécution. Le bilan des tests y
# figure aussi : combien ont réussi sur cette machine Windows, et lesquels
# n'y ont pas été exécutés — avec le motif.

name: Exécutable Windows

on:
  push:
    branches: ['**']
    # Une modification de la seule documentation ne nécessite pas de recompiler.
    paths:
      - '**'
      - '!README.md'
      - '!docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tester et fabriquer le .exe portable
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: bash scripts/ci-run.sh installation npm ci --no-audit --no-fund

      # Renommer ou déplacer sans jamais rien remplacer : Node ne sait pas le
      # faire (son renommage remplace le fichier en place). Un petit module
      # natif le demande donc à Windows — MoveFileExW sans l'option de
      # remplacement. Il est compilé ici, avec le compilateur C de la machine.
      - name: Compiler le module natif (déplacement sans remplacement)
        timeout-minutes: 10
        run: bash scripts/ci-run.sh module-natif npm run build:native

      # Avant tout le reste, le module est éprouvé sur le disque de cette
      # machine (NTFS) : un nom déjà pris est refusé par Windows lui-même, et
      # de plusieurs déplacements simultanés vers un même nom, un seul aboutit.
      - name: Vérifier que renommer ou déplacer ne remplace jamais rien
        timeout-minutes: 5
        run: bash scripts/ci-run.sh sans-remplacement node scripts/check-native.mjs --record=native/build/evolve_fs.sha256

      - name: Tests automatiques
        run: bash scripts/ci-run.sh tests-automatiques npm test

      # Les machines de GitHub affichent par défaut en 1024 × 768 ; une
      # définition courante donne des captures d'écran plus représentatives.
      # L'auto-test fonctionne dans les deux cas : cette étape est facultative.
      - name: Régler l'écran de la machine en 1920 × 1080
        continue-on-error: true
        shell: powershell
        run: |
          try {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop
            Write-Host "Ecran regle en 1920 x 1080."
          } catch {
            Write-Host "Reglage impossible, definition par defaut conservee : $($_.Exception.Message)"
          }

      # L'auto-test manœuvre le bureau et les fenêtres par de vrais gestes,
      # souris et clavier injectés dans le moteur d'affichage. S'ils ne
      # parvenaient pas à la page, les contrôles qui en dépendent ne seraient
      # pas menés : --require-input en fait alors un échec, pour qu'aucun
      # exécutable ne soit publié sans eux.
      - name: Auto-test de l'application (avant fabrication du .exe)
        timeout-minutes: 8
        run: bash scripts/ci-run.sh auto-test-application node scripts/check-exe.mjs electron --require-input --out=self-test-output/application -- .

      - name: Fabriquer l'exécutable portable
        run: bash scripts/ci-run.sh fabrication-executable npm run build:win

      - name: Vérifier que le .exe ne demande aucun droit administrateur
        run: bash scripts/ci-run.sh droits-administrateur npm run check:manifest

      # Le module embarqué dans l'exécutable doit être, octet pour octet, celui
      # qui a été compilé puis éprouvé avant les tests (son empreinte a été
      # inscrite à ce moment-là) ; il est éprouvé une seconde fois, tel qu'il
      # a été embarqué.
      - name: Vérifier le module natif embarqué dans l'exécutable
        timeout-minutes: 5
        run: bash scripts/ci-run.sh module-embarque node scripts/check-native.mjs --module=dist/win-unpacked/resources/app.asar.unpacked/native/build/Release/evolve_fs.node --expect=native/build/evolve_fs.sha256

      - name: Auto-test de l'exécutable portable
        timeout-minutes: 8
        run: bash scripts/ci-run.sh auto-test-executable node scripts/check-exe.mjs --out=self-test-output/executable --require-input

      # L'auto-test ouvre une fenêtre ordinaire ; ici, l'exécutable est lancé
      # sans aucune option d'essai, exactement comme par un double-clic.
      - name: Lancement normal de l'exécutable portable (plein écran)
        timeout-minutes: 8
        run: bash scripts/ci-run.sh lancement-normal node scripts/check-launch.mjs --out=self-test-output/lancement

      # Deux lancements successifs sur le véritable dossier de l'utilisateur
      # (%APPDATA%\Evolve, absent de cette machine) : le premier modifie des
      # réglages depuis l'interface, le script lit le fichier laissé sur le
      # disque, le second doit les afficher. Le fichier est ensuite retiré.
      - name: Réglages conservés après un redémarrage de l'exécutable portable
        timeout-minutes: 12
        run: bash scripts/ci-run.sh reglages-redemarrage node scripts/check-settings.mjs --out=self-test-output/reglages --settings-dir="$APPDATA/Evolve"

      # Evolve ne crée rien de lui-même : un dossier n'apparaît que si
      # l'utilisateur le demande. Le dossier Documents du compte de cette
      # machine est mis de côté (renommé) le temps d'un lancement :
      # l'exécutable doit l'annoncer comme introuvable, et le script constate
      # lui-même, sur le disque, que le dossier est toujours absent — avant de
      # le remettre en place.
      - name: Dossier Documents absent jamais recréé par l'exécutable portable
        timeout-minutes: 8
        run: bash scripts/ci-run.sh documents-absent node scripts/check-documents.mjs --out=self-test-output/documents-absent

      - name: Publier les rapports et les captures d'écran des vérifications
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auto-test
          path: |
            self-test-output/
            ci-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Résumé de l'exécutable
        run: |
          exe="$(ls dist/Evolve-*-portable.exe)"
          size="$(stat -c %s "$exe")"
          sha="$(sha256sum "$exe" | cut -d ' ' -f 1)"
          {
            echo "### 📦 Exécutable portable"
            echo ""
            echo "| Fichier | Taille | Empreinte SHA-256 |"
            echo "| --- | --- | --- |"
            echo "| \`$(basename "$exe")\` | $((size / 1024 / 1024)) Mo | \`$sha\` |"
            echo ""
            echo "Téléchargement : rubrique **Artifacts**, en bas de cette page."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Exécutable portable::$(basename "$exe") — $((size / 1024 / 1024)) Mo — SHA-256 $sha"

      # Publié tel quel (sans archive .zip) : le fichier téléchargé est
      # directement l'exécutable.
      - name: Publier l'exécutable
        uses: actions/upload-artifact@v7
        with:
          path: dist/Evolve-*-portable.exe
          archive: false
          if-no-files-found: error
          retention-days: 90
