<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Evolve">
  <!-- Icône d'Evolve : une planète et son anneau, clin d'œil au fond d'écran. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34157a"/>
      <stop offset="0.55" stop-color="#170838"/>
      <stop offset="1" stop-color="#07030f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a66bff" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecd9ff"/>
      <stop offset="0.35" stop-color="#9455ff" stop-opacity="0.55"/>
      <stop offset="0.65" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e06bff"/>
    </linearGradient>
    <radialGradient id="planet" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#f7ebff"/>
      <stop offset="0.32" stop-color="#c9a0ff"/>
      <stop offset="0.66" stop-color="#9455ff"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb3f4"/>
      <stop offset="0.5" stop-color="#d0a8ff"/>
      <stop offset="1" stop-color="#8e7bff"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="218" fill="url(#halo)"/>
  <rect x="26" y="26" width="460" height="460" rx="110" fill="none" stroke="url(#edge)" stroke-width="12"/>

  <!-- Logo (grille 64 × 64) agrandi et centré -->
  <g transform="translate(40 40) scale(6.75)">
    <g transform="rotate(-24 32 32)">
      <ellipse cx="32" cy="32" rx="27.5" ry="9.5" fill="none" stroke="url(#ring)" stroke-width="3.6" opacity="0.7"/>
    </g>
    <circle cx="32" cy="32" r="15.5" fill="url(#planet)"/>
    <g transform="rotate(-24 32 32)">
      <path d="M4.5 32A27.5 9.5 0 0 0 59.5 32" fill="none" stroke="url(#ring)" stroke-width="3.6"/>
    </g>
  </g>
</svg>
